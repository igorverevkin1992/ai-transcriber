services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - temp_data:/app/temp_files
      - docx_data:/app/completed_docx
      - db_data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/projects.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - dev

volumes:
  temp_data:
  docx_data:
  db_data:
  node_modules:
